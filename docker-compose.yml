version: '3.8'

services:
  # =========================================================================
  # PostgreSQL Database Service
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: etms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etms_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-etms_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-etms_user} -d ${POSTGRES_DB:-etms_db}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - etms_network

  # =========================================================================
  # Redis Cache & Pub/Sub Service (Optional In-Memory Store)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: etms_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - etms_network

  # =========================================================================
  # Node.js Express Backend Service
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etms_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-super_secure_production_jwt_secret_esports_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DATABASE_URL: ${DATABASE_URL:-postgresql://etms_user:etms_password_2026@postgres:5432/etms_db?schema=public}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:3000}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - etms_network

  # =========================================================================
  # Nginx Frontend SPA & Reverse Proxy Service
  # =========================================================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: etms_frontend
    restart: unless-stopped
    ports:
      - '80:80'
      - '3000:80'
    depends_on:
      - backend
    networks:
      - etms_network

# =========================================================================
# Persistent Storage Volumes & Private Network
# =========================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  etms_network:
    driver: bridge
