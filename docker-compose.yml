version: '3.8'

services:
  # ============================================================================
  # POSTGRESQL DATABASE
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: etms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: esports_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esports_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - etms-network

  # ============================================================================
  # OPTIONAL IN-MEMORY REDIS CACHE
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: etms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - etms-network

  # ============================================================================
  # NODE.JS BACKEND & WEBSOCKET ENGINE
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etms-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres_secure_password@postgres:5432/esports_db?schema=public
      JWT_SECRET: esports_production_master_jwt_secret_key_2026_change_in_production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000,http://localhost:80
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - etms-network

  # ============================================================================
  # NGINX FRONTEND SPA RUNNER
  # ============================================================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: etms-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - etms-network

# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================
volumes:
  postgres_data:
    driver: local

networks:
  etms-network:
    driver: bridge
